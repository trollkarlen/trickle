---
name: fedora 41

"on":
  push:
    branches:
      - master
      - devel
  pull_request:


jobs:
  container-test-job:
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install packages
        run: yes | dnf install automake gcc which g++ pkgconf-pkg-config libtool libevent-devel libtirpc-devel
      - name: show versions
        run: |
          set -x
          autoreconf --version
          gcc --version
          libtool --version
      - name: bootstrap
        run: autoreconf -if
      - name: configure
        run: ./configure
      - name: make
        run: make
      # - name: make check
      #   run: make check
      # - name: make distcheck
      #   run: make distcheck
      - name: store the logs as an artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          path: '*.log'
