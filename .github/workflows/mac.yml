---
name: mac os x default build

"on":
  push:
    branches:
      - main
      - devel
  pull_request:

jobs:
  build:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install packages
        run: brew install automake autoconf pkg-config libtool libevent
        # libtirpc
      - name: bootstrap
        run: autoreconf -if
      - name: configure
        # libtipc does not build or exixt for mac
        run: ./configure --with-libevent=$(brew --prefix libevent) --disable-trickled
      - name: make
        run: make
      # tests fail because readlink does not understand -f on mac
      # install greadlink and use that instead ?
      # - name: make check
      #   run: make check
      # - name: make distcheck
      #   run: make distcheck CXXFLAGS=-std=c++11
      - name: Upload a Build Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          path: '**/*.log'
